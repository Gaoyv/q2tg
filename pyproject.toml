[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "efb-qq-napcat"
version = "0.1.0"
description = "A modern NapCat/OneBot 11 QQ slave channel for EH Forwarder Bot"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "AGPL-3.0-or-later" }
authors = [{ name = "q2tg contributors" }]
dependencies = [
  "ehforwarderbot>=2.1.1,<3",
  "httpx>=0.27,<1",
  "PyYAML>=6,<7",
  # EFB 2.1.1 still imports pkg_resources, removed in newer setuptools.
  "setuptools<81",
  "websockets>=12,<14",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]

[project.entry-points."ehforwarderbot.slave"]
"milkice.qq" = "efb_qq_napcat:QQMessengerChannel"

[project.optional-dependencies]
test = [
  "pytest>=8,<9",
  "pytest-asyncio>=0.23,<1",
]

[tool.setuptools.packages.find]
include = ["efb_qq_napcat*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
